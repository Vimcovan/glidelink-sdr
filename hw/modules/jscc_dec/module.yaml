# GlideLink user module description (docs/design.md 5.3)
id: jscc_dec
name: DeepJSCC-Q decoder
bus: module                  # decodes AXI4-Lite itself (hw/modules/module_desc.py)
top: glidelink_jscc_dec
source: competition design Vimcovan/glidelink-fpga @ 8367bee, src/hw/rx/rtl/network (generated RTL and weights, unchanged)
id_value: 0x4A444543          # "JDEC"
version: 1.0.0
clock_mhz: 250                # the layer parallelism was chosen for 30 fps at 250 MHz
uses: [nn_common]
data:
  input: "32,768 soft symbols per image {Q, I}, 12-bit Q10 sign-extended (the OFDM receiver's output)"
  output: "256x256 RGB uint8, NHWC, four bytes per word (little endian): 49,152 words per image; tlast on the last"
registers:
  - {name: ID, offset: 0x000, access: ro}
  - {name: VERSION, offset: 0x004, access: ro}
  - name: CONTROL
    offset: 0x008
    access: rw
    default: 1
    fields:
      - {name: enable, bits: 0, doc: "0 holds the input off"}
      - {name: soft_reset, bits: 1, doc: "self-clearing"}
  - {name: STATUS, offset: 0x00C, access: ro, fields: [{name: enabled, bits: 0}]}
  - {name: FRAMES_OUT, offset: 0x010, access: ro}
  - {name: SYMBOLS_IN, offset: 0x014, access: ro}
