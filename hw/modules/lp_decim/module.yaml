# GlideLink user module (docs/module_guide.md): fixed-coefficient FIR on the Xilinx FIR Compiler
id: lp_decim
name: Low-pass decimator by 2 (Xilinx FIR Compiler)
rtl: glidelink_lp_decim.v
top: glidelink_lp_decim
model: model.py
id_value: 0x4C504431          # "LPD1": the ID register, by which the PL block finds the slot
version: 1.0.0
uses: [fir_fixed]             # the shared wrapper and coefficient designs
ip: [ip/lp_decim.xci]            # vivado -mode batch -source ../fir_fixed/make_fir_ip.tcl -tclargs . Decimation 2 50
ip_files:
  lp_decim: {Coefficient_File: ip/lp_decim.coe}   # python ../fir_fixed/fir_fixed.py .
data:
  input: sc16
  output: sc16 at half the rate
rate: {decim: "enable ? 2 : 1"}   # packets: the platform's
function: >-
  RX: 4 to 2 samples per symbol after the RF (a QPSK at 4 samples per symbol occupies +-0.169 of the input rate). windowed-sinc low-pass (Hamming), cutoff 0.2 of the input rate, 33 taps, gain 1, x 2^15; the coefficients are set when the image is built (ip/lp_decim.coe from model.py
  taps()). Output sat16((y + 2^14) >> 15) on I and Q. Up to 50 MSPS in at 200 MHz.
  Disabled: samples pass unchanged.
registers:                    # ID 0x000, VERSION 0x004, then from 0x008 on; ports: docs/module_guide.md
  - name: CONTROL
    fields:
      - {name: enable, bits: 0, doc: "1 = filter, 0 = pass unchanged"}
      - {name: soft_reset, bits: 1, access: pulse, doc: "the IP reset: delay line cleared"}
  - {name: STATUS, access: ro, fields: [{name: enabled, bits: 0}]}
  - {name: TAPS, access: ro, value: 33, doc: "number of coefficients"}
  - {name: INTERP, access: ro, value: 1}
  - {name: DECIM, access: ro, value: 2}
block:                        # the GNU Radio blocks (PL and software); no parameters: fixed coefficients
  doc: >-
    RX: 4 to 2 samples per symbol after the RF (a QPSK at 4 samples per symbol occupies +-0.169 of the input rate): windowed-sinc low-pass (Hamming), cutoff 0.2 of the input rate, 33 taps, gain 1, x 2^15. Fixed in the image.
  params: []
  start: {CONTROL: 1}
tests:
  - {}
