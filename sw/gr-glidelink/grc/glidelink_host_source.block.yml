id: glidelink_host_source
label: GlideLink Host Source
category: '[GlideLink]'
flags: [python, throttle]

parameters:
-   id: args
    label: Device arguments
    dtype: string
    default: 'driver=glidelink'
-   id: type
    label: Item type
    dtype: enum
    options: [complex, int]
    option_labels: [Complex (sc16 / 32768), Int (raw 32-bit words)]
    option_attributes:
        dtype: [complex, int]
    default: complex
-   id: headers
    label: Packet headers
    dtype: bool
    default: 'True'
-   id: buffer_length
    label: Buffer length
    dtype: int
    default: '65536'

outputs:
-   domain: stream
    dtype: ${ type.dtype }

inputs:
-   domain: glidelink_pl
    dtype: sc16
    label: pl_in
    optional: true

templates:
    imports: from gnuradio import glidelink
    make: glidelink.host_source(${args}, '${type}', ${headers}, ${buffer_length})

documentation: |-
    Host port 1 of the GlideLink PL shell: the data of the modules in the slots. The PL input (orange) connects to the PL output of a module or of GlideLink Radio (PL) (sink host1_rx); the route can also be set with GlideLink Control.

    Complex: each 32-bit word {Q, I} as a complex number, full scale 32768. Int: the words as they are.

    With packet headers the source tags rx_time (at the first sample and after a gap) and rx_eob (last sample of a burst); the sink honours tx_time (timed packet) and tx_eob (end of burst) tags.

file_format: 1
