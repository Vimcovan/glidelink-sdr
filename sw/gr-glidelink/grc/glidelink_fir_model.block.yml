id: glidelink_fir_model
label: GlideLink FIR (software)
category: '[GlideLink]'
flags: [python]

parameters:
-   id: taps
    label: Coefficients (int16)
    dtype: int_vector
    default: '[32767]'
-   id: shift
    label: Output shift
    dtype: int
    default: '15'

inputs:
-   domain: stream
    dtype: complex

outputs:
-   domain: stream
    dtype: complex

templates:
    imports: from gnuradio import glidelink
    make: glidelink.fir_model(${taps}, ${shift})
    callbacks:
    - set_taps(${taps})
    - set_shift(${shift})

documentation: |-
    FIR by the reference model of the GlideLink FIR module (hw/modules/fir): bit-exact with the module in PL slot 2. Up to 32 signed 16-bit coefficients; output = (sum + 2^(shift-1)) >> shift, saturated.

file_format: 1
